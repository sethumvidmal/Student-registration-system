spring:
  datasource:
    # MariaDB server. Override per environment with DB_HOST, DB_PORT, DB_NAME, DB_USERNAME and DB_PASSWORD.
    # Hibernate detects the MariaDB dialect from the connection, so none is configured here.
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:institute_crm}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ICET@1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

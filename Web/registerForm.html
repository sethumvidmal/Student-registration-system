<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Registration System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🎓</div>
        <span>EduManage</span>
      </a>

      <button class="mobile-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">
        ☰
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">👥 Students</a></li>
        <li><a href="registerForm.html" class="nav-link active nav-cta">➕ Register Student</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="form-container">
      <div class="form-title">
        <h2>New Student Registration</h2>
        <p>Enter details below to register a new student into the system</p>
      </div>

      <form id="student-register-form">
        <div class="form-grid">
          
          <div class="form-group">
            <label class="form-label" for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-input" placeholder="e.g. John" required autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="lastName">Last Name</label>
            <input type="text" id="lastName" class="form-input" placeholder="e.g. Doe" required autocomplete="off">
          </div>

          <div class="form-group full-width">
            <label class="form-label">Gender</label>
            <div class="gender-radio-group">
              <div class="radio-pill">
                <input type="radio" id="gender-male" name="gender" value="Male" checked>
                <label for="gender-male">👨 Male</label>
              </div>
              <div class="radio-pill">
                <input type="radio" id="gender-female" name="gender" value="Female">
                <label for="gender-female">👩 Female</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="age">Age</label>
            <input type="number" id="age" class="form-input" placeholder="e.g. 21" min="10" max="100" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="nic">National Identity Card (NIC)</label>
            <input type="text" id="nic" class="form-input" placeholder="e.g. 200012345678" required autocomplete="off">
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="address">Address</label>
            <input type="text" id="address" class="form-input" placeholder="e.g. 123 Main Street, Colombo" required autocomplete="off">
          </div>

        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
          <a href="index.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="btnReg" class="btn btn-primary" style="padding: 0.75rem 2rem;">
            ✨ Register Student
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

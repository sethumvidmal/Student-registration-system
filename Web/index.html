<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Students · EduManage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M27 13v6M5 13l11-5 11 5-11 5zM10 15.5v5c3.5 3 8.5 3 12 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    (function () { try { var t = localStorage.getItem("edumanage.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
</head>
<body data-page="students" data-title="Students">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" id="main">
        <header class="page-header">
          <div>
            <h1 class="page-title">Students</h1>
            <p class="page-subtitle">Search, review and manage every registered student.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-secondary" id="export-btn"><i data-icon="download" data-size="15"></i><span>Export CSV</span></button>
            <a class="btn btn-primary" href="registerForm.html"><i data-icon="plus" data-size="15"></i><span>New student</span><kbd class="kbd">N</kbd></a>
          </div>
        </header>

        <section class="stats" aria-label="Overview">
          <article class="stat-card">
            <div class="stat-head"><span>Total students</span><span class="stat-icon"><i data-icon="users"></i></span></div>
            <p class="stat-value" id="stat-total">0</p>
            <div class="split-bar" aria-hidden="true"><span class="male" id="split-male"></span><span class="female" id="split-female"></span></div>
            <p class="stat-foot"><span class="dot dot-male"></span><span>Male</span><span class="dot dot-female"></span><span>Female</span></p>
          </article>
          <article class="stat-card">
            <div class="stat-head"><span>Male students</span><span class="stat-icon male"><i data-icon="mars"></i></span></div>
            <p class="stat-value" id="stat-male">0</p>
            <div class="meter male" aria-hidden="true"><span id="meter-male"></span></div>
            <p class="stat-foot" id="stat-male-share">&nbsp;</p>
          </article>
          <article class="stat-card">
            <div class="stat-head"><span>Female students</span><span class="stat-icon female"><i data-icon="venus"></i></span></div>
            <p class="stat-value" id="stat-female">0</p>
            <div class="meter female" aria-hidden="true"><span id="meter-female"></span></div>
            <p class="stat-foot" id="stat-female-share">&nbsp;</p>
          </article>
        </section>

        <section class="panel" aria-label="Student directory">
          <div class="toolbar">
            <div class="search-group">
              <div class="segmented" role="radiogroup" aria-label="Search by">
                <label><input type="radio" name="search-field" value="name" checked><span>Name</span></label>
                <label><input type="radio" name="search-field" value="nic"><span>NIC</span></label>
                <label><input type="radio" name="search-field" value="id"><span>ID</span></label>
              </div>
              <div class="search-input">
                <i data-icon="search" data-size="15"></i>
                <input type="search" id="search-input" data-search-input placeholder="Search by first or last name…" autocomplete="off" spellcheck="false" aria-label="Search students">
                <kbd class="kbd" aria-hidden="true">/</kbd>
                <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden><i data-icon="x" data-size="14"></i></button>
              </div>
            </div>
            <div class="toolbar-right">
              <div class="segmented" role="radiogroup" aria-label="Gender">
                <label><input type="radio" name="gender" value="" checked><span>All</span></label>
                <label><input type="radio" name="gender" value="M"><span>Male</span></label>
                <label><input type="radio" name="gender" value="F"><span>Female</span></label>
              </div>
              <div class="segmented segmented-icon" role="radiogroup" aria-label="Layout">
                <label title="Table view"><input type="radio" name="view" value="table" aria-label="Table view"><span><i data-icon="list" data-size="15"></i></span></label>
                <label title="Card view"><input type="radio" name="view" value="grid" aria-label="Card view"><span><i data-icon="layout-grid" data-size="15"></i></span></label>
              </div>
            </div>
          </div>
          <div class="progress-line" id="progress-line" aria-hidden="true"></div>
          <div class="results" id="results"></div>
          <footer class="panel-footer" id="pagination" hidden></footer>
        </section>
      </main>
    </div>
  </div>

  <!-- Student drawer: profile, edit and delete -->
  <div class="overlay" id="student-drawer" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-header">
        <h2 id="drawer-title">Student profile</h2>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Close"><i data-icon="x"></i></button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
      <footer class="drawer-footer" id="drawer-footer"></footer>
    </aside>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/students.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Registration System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="login.html" class="brand-logo">
        <div class="brand-icon">🎓</div>
        <span>EduManage</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="form-container login-container">
      <div class="form-title">
        <h2>Welcome Back</h2>
        <p>Sign in to manage student registrations</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="emailOrPhone">Email or Phone</label>
          <input type="text" id="emailOrPhone" class="form-input" placeholder="e.g. admin@icet.lk" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Your password" required autocomplete="current-password">
        </div>

        <p id="login-error" class="form-error" role="alert"></p>

        <button type="submit" id="btn-login" class="btn btn-primary login-submit">
          🔐 Sign In
        </button>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
